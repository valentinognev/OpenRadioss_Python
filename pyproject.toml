[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyradioss"
version = "0.1.0"
description = "Python port of the OpenRadioss explicit finite-element solver (Starter + Engine)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
# `test` is what CI installs (`pip install -e ".[test]"` in
# .github/workflows/ci.yml and parity.yml), so anything the suite needs to
# ASSERT must live here -- a test whose dependency CI does not install runs
# vacuously. `pyyaml` is here for tests/test_p1_ci_linux.py, which has to
# reject what a YAML parser rejects; without a real parser that file's
# "these workflows are valid YAML" test degrades to a one-rule lint that
# accepts an unterminated quoted scalar. Its exact pin belongs in
# requirements-lock.txt (not this file's to record) alongside the others.
test = ["pytest>=7", "pytest-xdist>=3", "scipy>=1.8", "pyyaml>=6.0"]
# the optional M7 accelerated backend (pyradioss/accel): the base install
# stays NumPy-only; select with PYRADIOSS_BACKEND=numba or -backend numba
# P0.7 (2026-10-03): the floor stays 0.59 (the M7-era minimum, unchanged on
# purpose — bumping it would drop interpreters that used to work).  The exact
# versions the extra was verified against are deliberately NOT repeated here:
# they are the `# pin:` lines of requirements-lock.txt ([B] this Linux .venv,
# [A] the Windows .venv), each asserted against the importable module by
# tests/test_p0_optional_deps.py, so this comment cannot drift out of
# agreement with them.  numba declares numpy<2.6,>=1.22, so the accel extra
# does NOT force a numpy downgrade.
accel = ["numba>=0.59"]
# the SPMD domain decomposition (pyradioss/spmd): real MPI processes under
# `mpirun -np N pyradioss-engine -np N ...` need mpi4py (+ an MPI library);
# without it `-np N` still runs the N domains as threads of one process
# (pyradioss/spmd/comm.py ThreadComm), so it stays optional.
# P0.7: mpi4py alone is NOT enough — an MPI implementation must be present
# too.  mpi4py is LAZY: `import mpi4py` succeeds with no MPI runtime at all
# (verified on the 4.1.2 wheel), and libmpi is resolved on the first
# `from mpi4py import MPI`, which raises RuntimeError("cannot load MPI
# library") on mpi4py 4.x (ImportError on 3.x, not verified here).  So
# `pip install mpi4py` on a box without MPICH/Open MPI adds a dependency
# that cannot work; install one of `apt-get install mpich libopenmpi-dev` or
# `conda install -c conda-forge mpich` first.  Until then `-np N` uses the
# in-process ThreadComm path (pyradioss/spmd/comm.py).
mpi = ["mpi4py>=3.1"]
# the M8 implicit solver (pyradioss/implicit): SciPy is REQUIRED for implicit
# runs (sparse assembly + SuperLU) but OPTIONAL for the explicit solver, so it
# lives here rather than in the base deps. scikit-sparse (CHOLMOD) and
# python-mumps are further-optional direct-solver backends (each falls back to
# SuperLU with a warning when absent — see pyradioss/implicit/linsolve.py).
implicit = ["scipy>=1.8"]
cholmod = ["scipy>=1.8", "scikit-sparse>=0.4"]
mumps = ["scipy>=1.8", "python-mumps>=0.0.1"]
# the M41 GUI post-processing converters (pyradioss/gui/postproc.py): the
# Vortex-Radioss anim->d3plot bridge + the lasso-python d3plot reader used to
# verify it. Vortex-Radioss is NOT on PyPI, so the pin is a git tag.
# WHY v1.021 specifically: EFFECTIVE PLASTIC STRAIN. The original "Official"
# tag carried NO effective-plastic-strain handling at all (the array is simply
# absent from the d3plot); the mapping was added Aug-2024, and the v1.02/v1.021
# generation additionally added the solid EPSFLG array, the shell stress/strain
# local->global tensor transforms, and the v1.021 "incorrect assignment of
# arrays to data fields" global-history bugfix. Empirically verified on a real
# Johnson-Cook run: element_shell_effective_plastic_strain is present and
# non-zero at the final state. (This matches the generation the maintainer
# already vendors for their oropt / openradioss_fatigue tooling.)
postproc = [
    "lasso-python",
    "vortex_radioss @ git+https://github.com/Vortex-CAE/Vortex-Radioss.git@v1.021",
]

[project.scripts]
# The two console scripts mirror the two OpenRadioss executables
# (starter_linux64_gf / engine_linux64_gf placed in OpenRadioss/exec).
pyradioss-starter = "pyradioss.starter.__main__:main"
pyradioss-engine = "pyradioss.engine.__main__:main"
# the run-and-monitor GUI (pyradioss.gui) — Tkinter (stdlib); matplotlib is
# OPTIONAL (embedded T01 plots when present, textual table otherwise)
pyradioss-gui = "pyradioss.gui.__main__:main"

[tool.setuptools.packages.find]
include = ["pyradioss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running test (>=60 s serial); deselect the slow tier with -m \"not slow\"",
]

